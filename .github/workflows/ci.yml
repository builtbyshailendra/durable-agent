name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:  # DBOS's system database; tests expect it on 5433, like the local test cluster
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install
        run: pip install -e ".[dev]"
      - name: tests (workers as real processes, killed mid-run)
        run: python -m pytest -q
      - name: demo
        run: python scripts/demo.py
